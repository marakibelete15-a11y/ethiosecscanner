<!DOCTYPE html>
<html lang="en">
<head>
    

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EthioSecScan</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

    <!-- Background -->
    <div class="dashboard-bg">
        <div class="glow-one"></div>
        <div class="glow-two"></div>
    </div>

    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-label="Open menu">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" data-action="close-sidebar"></div>

    <div class="layout">

        <!-- ============ SIDEBAR ============ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">🛡️</div>
                <span class="logo-text">EthioSecScan</span>
            </div>
                        <nav class="sidebar-nav" aria-label="Main navigation"></nav>
      
      
      
      
      
      
            <div class="scanner-status">
                <div class="status-dot"></div>
                <span>Scanner Engine Online</span>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-details">
                        <span class="user-name">Loading account…</span>
                        <span class="user-email" id="userEmailDisplay"></span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" data-action="logout" type="button">Log Out</button>
            </div>
        </aside>

        <!-- ============ MAIN CONTENT ============ -->
        <main class="dashboard-container" id="authLoading" role="status" aria-live="polite">Checking your session…</main>
    </div>

    

    <script src="/static/js/config.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
