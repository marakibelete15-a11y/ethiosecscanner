<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Ownership Verification - EthioSecScan</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/scan.css">
</head>
<body>

  <!-- Background -->
  <div class="dashboard-bg">
    <div class="glow-one"></div>
    <div class="glow-two"></div>
  </div>

  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open menu" data-action="toggle-sidebar">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" data-action="close-sidebar"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🛡️</div>
        <span class="logo-text">EthioSecScan</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="side-link"><span class="side-icon">📊</span> Dashboard</a>
        <a href="new_scan.html" class="side-link"><span class="side-icon">⚡</span> New Scan</a>
        <a href="history.html" class="side-link"><span class="side-icon">🕒</span> History</a>
        <a href="results.html" class="side-link"><span class="side-icon">📈</span> Results</a>
        <a href="reports.html" class="side-link"><span class="side-icon">📄</span> Reports</a>
        <a href="ai_assistant.html" class="side-link"><span class="side-icon">🤖</span> AI Assistant</a>
        <div class="nav-divider" style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
        <a href="settings.html" class="side-link"><span class="side-icon">⚙️</span> Settings</a>
        <a href="#" class="side-link" data-action="logout"><span class="side-icon">🚪</span> Logout</a>
      </nav>
      <div class="scanner-status">
        <div class="status-dot"></div>
        <span>Target Verification Ready</span>
      </div>
    </aside>

    <main class="page-container">
      <div class="page-header">
        <div class="header-content">
          <h1>Target Verification</h1>
          <p>Verify ownership of your target domain prior to scanning</p>
        </div>
      </div>

      <section class="panel">
        <div class="card-header">
          <h2>Ownership Challenge</h2>
        </div>
        <div id="targetVerifyContainer">
          <!-- DATA: target verification details filled by target_verify.js -->
          <p class="empty-state">Select a target or enter a URL to verify ownership.</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/target_verify.js"></script>
</body>
</html>
