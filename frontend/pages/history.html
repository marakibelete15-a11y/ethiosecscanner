<!DOCTYPE html>
<html lang="en">
<head>
    

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History - EthioSecScan</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/scan.css">
    <link rel="stylesheet" href="/static/css/history_page.css">
</head>
<body>

<div class="dashboard-bg">
    <div class="glow-one"></div>
    <div class="glow-two"></div>
</div>

<button class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-label="Open menu">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" data-action="close-sidebar"></div>

<div class="layout">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🛡️</div>
            <span class="logo-text">EthioSecScan</span>
        </div>
                <nav class="sidebar-nav" aria-label="Main navigation"></nav>
      
      
      
      
      
      
        <div class="scanner-status">
            <div class="status-dot"></div>
            <span>Database Synced</span>
        </div>
    </aside>

    <main class="page-container history-page">

        <div class="page-header">
            <div class="header-content">
                <h1>Scan History</h1>
                <p>Review and re-open your previous security scans</p>
            </div>
            <a href="new_scan.html" class="primary-btn">🔍 New scan</a>
        </div>

        <div class="filters-section">
            <div class="filter-group">
                <label for="statusFilter">Filter by status</label>
                <select id="statusFilter">
                    <option value="all">All</option>
                    <option value="queued">Queued</option>
                    <option value="running">Running</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="targetFilter">Filter by target</label>
                <select id="targetFilter">
                    <option value="all">All targets</option>
                </select>
            </div>
        </div>
        <p class="history-filter-error" id="targetFilterError" role="alert" aria-live="assertive" hidden></p>

        <div class="table-container">
            <div class="table-header">
                <h2>Scans</h2>
                <span id="resultCount">Loading…</span>
            </div>

            <p class="history-loading" id="historyLoading" role="status" aria-live="polite">Loading scan history…</p>
            <p class="history-error" id="historyError" role="alert" aria-live="assertive" hidden></p>
            <p class="history-empty" id="historyEmpty" hidden>No scans yet. <a href="new_scan.html">Start a new scan</a>.</p>

            <div class="table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>URL</th>
                            <th>Status</th>
                            <th>Depth</th>
                            <th>Score</th>
                            <th>Started</th>
                            <th>Critical</th>
                            <th>High</th>
                            <th>Medium</th>
                            <th>Low</th>
                            <th>Info</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="pagination">
            <button id="prevBtn" data-action="prev-page" type="button">← Previous</button>
            <span id="pageInfo"><!-- DATA: pagination filled by history.js --></span>
            <button id="nextBtn" data-action="next-page" type="button">Next →</button>
        </div>

    </main>
</div>

<div class="toast" id="toast"></div>



<script src="/static/js/config.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/scan_helpers.js"></script>
<script src="/static/js/history.js"></script>

</body>
</html>
