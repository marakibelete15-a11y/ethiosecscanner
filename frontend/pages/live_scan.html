<!DOCTYPE html>
<html lang="en">
<head>
    

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan in progress - EthioSecScan</title>
  <link rel="stylesheet" href="/static/css/global.css">
  <link rel="stylesheet" href="/static/css/scan.css">
  <link rel="stylesheet" href="/static/css/live_scan.css">
</head>
<body>

  <!-- Background -->
  <div class="dashboard-bg">
    <div class="glow-one"></div>
    <div class="glow-two"></div>
  </div>

  <button class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-label="Open menu">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" data-action="close-sidebar"></div>

  <div class="layout">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">🛡️</div>
        <span class="logo-text">EthioSecScan</span>
      </div>
      <nav class="sidebar-nav" aria-label="Main navigation"></nav>
      
      
      
      
      
      
      <div class="scanner-status">
        <div class="status-dot"></div>
        <span>Engine Active</span>
      </div>
    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="page-container live-scan-page">
      <div class="page-header">
        <div class="header-content">
          <h1>Scan progress</h1>
          <p id="scanTarget">Loading scan status…</p>
        </div>
        <a href="new_scan.html" class="ghost-btn">← Back to scanner</a>
      </div>

      <section class="panel progress-panel">
        <div id="scanError" class="live-scan-error" role="alert" aria-live="assertive" hidden></div>
        <p id="pollingStatus" class="live-scan-polling" role="status" aria-live="polite">Connecting to scan status…</p>
        <div id="scanDetails" class="live-scan-details" hidden>
          <div class="live-scan-status-row">
            <div>
              <p class="live-scan-label">Status</p>
              <p class="live-scan-status" id="statusLabel">Queued</p>
            </div>
            <div class="live-scan-progress-value" id="progressPercent">0%</div>
          </div>
          <div class="progress-bar" role="progressbar" id="scanProgress" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <p class="live-scan-current" id="currentModule">Waiting for the scan worker…</p>
          <p class="live-scan-error-message" id="scanFailureMessage" hidden></p>
          <h2 class="live-scan-modules-heading">Module progress</h2>
          <ul class="live-scan-modules" id="moduleProgressList"></ul>
        </div>
        <div class="progress-actions">
          <button class="ghost-btn" id="retryPolling" type="button" hidden>Retry status</button>
          <button class="ghost-btn" id="cancelScan" type="button" hidden>Cancel scan</button>
          <a class="primary-btn" id="viewResults" href="#" hidden>View results</a>
          <a class="ghost-btn" id="startAnotherScan" href="new_scan.html" hidden>Start another scan</a>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  

  <script src="/static/js/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/live_scan.js"></script>
</body>
</html>
